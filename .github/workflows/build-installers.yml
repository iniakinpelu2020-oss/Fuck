name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Add and sync Android project
        run: |
          npx cap add android || true
          npx cap sync android
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          if (!fs.existsSync(p)) { console.error('AndroidManifest.xml not found at', p); process.exit(1); }
          let s = fs.readFileSync(p, 'utf8');

          // Ensure INTERNET and ACCESS_NETWORK_STATE permissions
          const perms = [
            '<uses-permission android:name="android.permission.INTERNET" />',
            '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          ];
          for (const perm of perms) {
            if (!s.includes(perm)) {
              s = s.replace(/<application\b/, perm + '\n    <application');
              console.log('Added permission:', perm);
            }
          }

          // Ensure android:usesCleartextTraffic="true" on <application>
          const appTag = s.match(/<application\b[^>]*>/);
          if (appTag && /android:usesCleartextTraffic\s*=\s*"[^"]*"/.test(appTag[0])) {
            s = s.replace(/(<application\b[^>]*?)android:usesCleartextTraffic\s*=\s*"[^"]*"/, '$1android:usesCleartextTraffic="true"');
          } else if (/<application\b/.test(s)) {
            s = s.replace(/<application\b/, '<application android:usesCleartextTraffic="true"');
          }
          console.log('Ensured android:usesCleartextTraffic="true" on <application>');

          // Deep link intent-filter for com.drippydee.apexstudio
          if (!s.includes('android:scheme="com.drippydee.apexstudio"')) {
            const filter = [
              '            <intent-filter>',
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              '                <data android:scheme="com.drippydee.apexstudio" />',
              '            </intent-filter>'
            ].join('\n');
            const idx = s.lastIndexOf('</activity>');
            if (idx === -1) { console.error('No </activity> tag found in manifest'); process.exit(1); }
            s = s.slice(0, idx) + filter + '\n        ' + s.slice(idx);
            console.log('Added com.drippydee.apexstudio deep link intent-filter');
          } else {
            console.log('Deep link intent-filter already present');
          }

          fs.writeFileSync(p, s);
          NODE

          echo "===== Generating deterministic Android debug keystore ====="
          mkdir -p ~/.android
          rm -f android/app/debug.keystore ~/.android/debug.keystore
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -startdate "2026/01/01 00:00:00" \
            -dname "CN=ApexStudioDebug,OU=Dev,O=DrippyDee,L=Ibadan,S=Oyo,C=NG"
          cp android/app/debug.keystore ~/.android/debug.keystore
          echo "===== Android debug keystore SHA-1 (use this for Firebase/Google Sign-In) ====="
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | tee -a $GITHUB_STEP_SUMMARY
          echo "===== End Android debug keystore fingerprints ====="

          echo "===== Patching Android Gradle for deterministic debug keystore and Google Services ====="
          node -e '
            const fs = require("fs");
            const appGradlePath = "android/app/build.gradle";
            const rootGradlePath = "android/build.gradle";
            if (!fs.existsSync(appGradlePath)) { console.error("Gradle file not found:", appGradlePath); process.exit(1); }
            let gradle = fs.readFileSync(appGradlePath, "utf8");

            const signingBlock = `
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {`;
            if (!gradle.includes("signingConfigs {")) {
              gradle = gradle.replace("buildTypes {", signingBlock);
            }
            if (/buildTypes\s*\{[\s\S]*?debug\s*\{/.test(gradle)) {
              gradle = gradle.replace(/(buildTypes\s*\{[\s\S]*?debug\s*\{)(?![\s\S]*?signingConfig\s+signingConfigs\.debug)/, "$1\n            signingConfig signingConfigs.debug");
            }

            if (!/com\.google\.gms\.google-services/.test(gradle)) {
              gradle += "\n\nif (file(\"google-services.json\").exists()) {\n    apply plugin: \"com.google.gms.google-services\"\n}\n";
              console.log("Added conditional com.google.gms.google-services plugin to android/app/build.gradle");
            } else {
              console.log("com.google.gms.google-services already present in android/app/build.gradle");
            }
            fs.writeFileSync(appGradlePath, gradle, "utf8");
            console.log("Patched android/app/build.gradle for deterministic debug signing");

            if (fs.existsSync(rootGradlePath)) {
              let root = fs.readFileSync(rootGradlePath, "utf8");
              if (!/com\.google\.gms:google-services/.test(root)) {
                if (/dependencies\s*\{/.test(root)) {
                  root = root.replace(/(dependencies\s*\{)/, "$1\n        classpath \"com.google.gms:google-services:4.4.2\"");
                  fs.writeFileSync(rootGradlePath, root, "utf8");
                  console.log("Added google-services classpath to android/build.gradle");
                } else {
                  console.warn("Could not find dependencies block in android/build.gradle; skipped classpath patch");
                }
              } else {
                console.log("google-services classpath already present in android/build.gradle");
              }
            } else {
              console.warn("android/build.gradle not found; skipped classpath patch");
            }
          '

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          chmod +x android/gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote android/app/google-services.json from secret"
          else
            echo "GOOGLE_SERVICES_JSON secret not set; skipping google-services.json"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: Apex-Studio-Windows-Installer
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            artifact-name: Apex-Studio-macOS-Installer
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish-release:
    name: Publish Latest Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release binaries
        run: |
          set -euo pipefail
          mkdir -p release
          APK=$(find artifacts/Apex-Studio-Android-APK -type f -name '*.apk' | head -n 1)
          EXE=$(find artifacts/Apex-Studio-Windows-Installer -type f -name '*.exe' | head -n 1)
          DMG=$(find artifacts/Apex-Studio-macOS-Installer -type f -name '*.dmg' | head -n 1)
          if [ -z "$APK" ] || [ -z "$EXE" ] || [ -z "$DMG" ]; then
            echo "Missing expected installer artifact(s)"
            find artifacts -type f || true
            exit 1
          fi
          cp "$APK" release/Apex-Studio-Android.apk
          cp "$EXE" release/Apex-Studio-Windows.exe
          cp "$DMG" release/Apex-Studio-macOS.dmg
          ls -lh release

      - name: Publish latest GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Apex Studio Latest"
          prerelease: false
          make_latest: true
          files: |
            release/Apex-Studio-Android.apk
            release/Apex-Studio-Windows.exe
            release/Apex-Studio-macOS.dmg
