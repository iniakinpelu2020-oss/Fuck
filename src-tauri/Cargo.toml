[package]
name = "apex-studio"
version = "1.0.0"
description = "Apex Studio"
authors = ["Apex Studio"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "apex_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
